name: Deploy Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    name: deploy-preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Mini App
        run: |
          cd apps/miniapp
          VITE_API_BASE_URL=https://api-development.qahal.xyz \
          VITE_ENABLE_PROFILE_TESTING=true \
          bun run build

      - name: Create GitHub deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: 'preview',
              description: `Preview deployment for PR #${prNumber}`,
              required_contexts: [],
              auto_merge: false,
              transient_environment: true,
              production_environment: false,
              payload: JSON.stringify({ app: 'qahal', pr: prNumber }),
            });
            core.setOutput('deployment_id', String(data.id));

      - name: Deploy Pages Preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/miniapp
          command: pages deploy dist --project-name qahal-dev --branch ${{ github.head_ref }}

      - name: Finalize deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = Number('${{ steps.create_deployment.outputs.deployment_id }}');
            const previewUrl = '${{ steps.deploy.outputs.deployment-url }}';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment: 'preview',
              environment_url: previewUrl || 'https://${{ github.head_ref }}.qahal-dev.pages.dev',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Preview deployment ready',
            });
